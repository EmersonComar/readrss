name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Compilar binário (x86_64)
    needs: ci
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependências do sistema
        run: scripts/ci-install-deps.sh
      - name: Versão da tag confere com o Cargo.toml
        run: |
          cargo_version="$(cargo pkgid --package readrss | sed 's/.*[#@]//')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $cargo_version | tag: $tag_version"
          test "$cargo_version" = "$tag_version"
      - name: Compilar
        run: cargo build --release --locked --package readrss
      - name: Empacotar
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Atestado de procedência
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(ls dist/*.tar.gz)"
          cat > notes.md <<EOF
          Binário pronto para Linux x86_64 (Ubuntu 26.04 ou equivalente). Instruções de instalação no README.

          Verificar o download:

          \`\`\`sh
          sha256sum -c SHA256SUMS
          gh attestation verify $(basename "$archive") --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "readrss $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
