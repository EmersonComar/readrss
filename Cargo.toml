[package]
name = "readrss"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Emerson Comar"]
description = "Leitor de feeds RSS/Atom para desktop (GTK4 + libadwaita)"
publish = false

[workspace]
members = [".", "tools/extract-strings"]
default-members = ["."]

[lib]
path = "src/lib.rs"

[[bin]]
name = "readrss"
path = "src/main.rs"

[[test]]
name = "gui"
path = "tests/gui.rs"
harness = false

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
webkit6 = { version = "0.6", features = ["v2_50"] }
rusqlite = "0.40"
feed-rs = "3"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
dom_smoothie = "0.18"
dom_query = "0.28"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fancy-regex = "0.19"
unicode-normalization = "0.1"
quick-xml = "0.42"
glib-unix = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
