[package]
name = "readrss"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Emerson Comar"]
description = "Desktop RSS/Atom feed reader (GTK4 + libadwaita)"
readme = "README.md"
repository = "https://github.com/EmersonComar/readrss"
homepage = "https://github.com/EmersonComar/readrss"
rust-version = "1.93"
publish = false

[workspace]
members = [".", "tools/extract-strings"]
default-members = ["."]

[lib]
path = "src/lib.rs"

[[bin]]
name = "readrss"
path = "src/main.rs"

[[test]]
name = "gui"
path = "tests/gui.rs"
harness = false

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
webkit6 = { version = "0.6", features = ["v2_50"] }
rusqlite = "0.40"
feed-rs = "3"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "gzip"] }
dom_smoothie = "0.18"
dom_query = "0.28"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fancy-regex = "0.19"
unicode-normalization = "0.1"
quick-xml = "0.42"
glib-unix = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Emerson Comar <dev@emersoncomar.com.br>"
copyright = "2026, Emerson Comar"
license-file = ["debian/copyright", "0"]
section = "web"
priority = "optional"
extended-description = """\
Desktop RSS/Atom feed reader for GNOME, built with GTK4 and libadwaita. Reads the feed \
summary, extracts the full article or opens the original page inside the app, filters \
articles by keywords or regular expressions and keeps syncing in the background with \
desktop notifications."""
depends = "$auto"
recommends = "gstreamer1.0-plugins-bad"
maintainer-scripts = "debian/"
changelog = "target/debian-extra/changelog"
assets = [
    ["target/release/readrss", "usr/bin/", "755"],
    ["data/locale/es/LC_MESSAGES/readrss.mo", "usr/share/readrss/locale/es/LC_MESSAGES/", "644"],
    ["data/locale/pt_BR/LC_MESSAGES/readrss.mo", "usr/share/readrss/locale/pt_BR/LC_MESSAGES/", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.readrss.ReadRSS.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/hicolor/symbolic/apps/io.github.readrss.ReadRSS-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["data/icons/hicolor/symbolic/apps/io.github.readrss.ReadRSS-filter-symbolic.svg", "usr/share/readrss/icons/hicolor/symbolic/apps/", "644"],
    ["data/io.github.readrss.ReadRSS.desktop", "usr/share/applications/", "644"],
    ["data/readrss.service", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/readrss/", "644"],
    ["target/debian-extra/readrss.1.gz", "usr/share/man/man1/", "644"],
    ["debian/lintian-overrides", "usr/share/lintian/overrides/readrss", "644"],
]
